name: App checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: app-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without native app lifecycle hooks
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Run all app and retained tests
        run: npm test
      - name: Check both TypeScript projects
        run: npm run typecheck
      - name: Build renderer and Electron JavaScript without launching the app
        run: npm run build
